<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E7C86">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Life Planner">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>html{color-scheme:light dark}body{margin:0}</style>
<title>Smart Life Planner</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Concept : poste de commandement calme. Barre latérale (bas d'écran sur téléphone),
   une couleur par nature de journée (jour, nuit, récupération, repos, cours). */
:root{
  --bg:#F1F4F8; --surface:#FFFFFF; --surface2:#E9EEF4; --fg:#141B2D; --muted:#59657A; --line:#DAE1EA;
  --accent:#0E7C86; --accent-fg:#FFFFFF; --accent-soft:#D6EEF0;
  --day:#B97F00; --day-soft:#FBEFCD; --night:#3B4BA8; --night-soft:#DEE2F7;
  --recov:#7352A6; --recov-soft:#E9E0F4; --rest:#23875C; --rest-soft:#D7F0E3;
  --course:#B83A74; --course-soft:#F8DDEA; --conge:#5E6B80; --conge-soft:#E3E8EF;
  --danger:#C93636; --danger-soft:#FBDEDE; --warn:#A86600; --warn-soft:#FBEACB; --info:#2D5FBF; --info-soft:#DCE7FB;
  --c-fr:#2F63D0; --c-en:#8446CF; --c-ai:#0E7C86; --c-sport:#D4581F; --c-other:#667386; --c-rattrapage:#B83A74;
  --shadow:0 1px 2px rgba(20,27,45,.06),0 6px 20px rgba(20,27,45,.05);
  --f-head:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif; --f-body:'Inter','Segoe UI',system-ui,sans-serif; --f-mono:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D121C; --surface:#151C2A; --surface2:#1D2638; --fg:#E7ECF4; --muted:#9AA6BB; --line:#283248;
  --accent:#43C4CF; --accent-fg:#06262A; --accent-soft:#11373B;
  --day:#F0B429; --day-soft:#3A2F10; --night:#94A2F5; --night-soft:#1F2650;
  --recov:#BBA0E4; --recov-soft:#2C2342; --rest:#52CD96; --rest-soft:#123A2A;
  --course:#F27FB0; --course-soft:#44192F; --conge:#9AA6BB; --conge-soft:#222C3F;
  --danger:#FF8080; --danger-soft:#43191A; --warn:#F2B55E; --warn-soft:#3A2A0E; --info:#8DB1FF; --info-soft:#18284A;
  --c-fr:#7AA2FF; --c-en:#BE95F5; --c-ai:#43C4CF; --c-sport:#FF9460; --c-other:#9AA6BB; --c-rattrapage:#F27FB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D121C; --surface:#151C2A; --surface2:#1D2638; --fg:#E7ECF4; --muted:#9AA6BB; --line:#283248;
  --accent:#43C4CF; --accent-fg:#06262A; --accent-soft:#11373B;
  --day:#F0B429; --day-soft:#3A2F10; --night:#94A2F5; --night-soft:#1F2650;
  --recov:#BBA0E4; --recov-soft:#2C2342; --rest:#52CD96; --rest-soft:#123A2A;
  --course:#F27FB0; --course-soft:#44192F; --conge:#9AA6BB; --conge-soft:#222C3F;
  --danger:#FF8080; --danger-soft:#43191A; --warn:#F2B55E; --warn-soft:#3A2A0E; --info:#8DB1FF; --info-soft:#18284A;
  --c-fr:#7AA2FF; --c-en:#BE95F5; --c-ai:#43C4CF; --c-sport:#FF9460; --c-other:#9AA6BB; --c-rattrapage:#F27FB0;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-head);margin:0;letter-spacing:-.01em;text-wrap:balance}
h2{font-size:20px} h3{font-size:15px}
p{margin:0}
.mut{color:var(--muted)} .sm{font-size:12px} .num{font-variant-numeric:tabular-nums} .mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}

.app{display:grid;grid-template-columns:224px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding-block:20px 40px}
.side{position:sticky;top:20px;align-self:start;display:flex;flex-direction:column;gap:6px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 16px}
.logo{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand b{font-family:var(--f-head);font-size:17px;line-height:1.1;display:block}
.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;border:0;background:none;cursor:pointer;color:var(--muted);font-weight:500;text-align:left;width:100%}
.nav:hover{background:var(--surface2);color:var(--fg)}
.nav.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-weight:600}
.nav.on .ic{color:var(--accent)}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.side-foot{margin-top:14px;padding:12px;border-radius:12px;background:var(--surface2);font-size:12px;color:var(--muted)}
.main{min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top h1{font-size:26px;flex:1;min-width:0}
.top .date{color:var(--muted);font-size:13px;width:100%;order:3}
.bottom{display:none}

.card{background:var(--surface);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);min-width:0}
.card>h3,.card-h{flex-wrap:wrap;display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}
.card-h h3{margin:0}
.grid{display:grid;gap:16px;min-width:0}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))} .g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.gauto{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sp{flex:1}
.stack{display:flex;flex-direction:column;gap:10px;min-width:0}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--surface);cursor:pointer;font-weight:600;font-size:13px;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.dng{color:var(--danger)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn .ic{width:16px;height:16px}
.ib{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--muted)}
.ib:hover{background:var(--surface2);color:var(--fg)}
.ib .ic{width:18px;height:18px}
.ib.sm{width:28px;height:28px}.ib.sm .ic{width:15px;height:15px}

.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.k-day{--k:var(--day);--ks:var(--day-soft)}.k-prenight{--k:var(--night);--ks:var(--night-soft)}
.k-recovery{--k:var(--recov);--ks:var(--recov-soft)}.k-rest{--k:var(--rest);--ks:var(--rest-soft)}.k-conge{--k:var(--conge);--ks:var(--conge-soft)}
.chip.k-day,.chip.k-prenight,.chip.k-recovery,.chip.k-rest,.chip.k-conge{background:var(--ks);color:var(--k)}
.b-conflict{background:var(--danger-soft);color:var(--danger)}
.b-afterNight{background:var(--recov-soft);color:var(--recov)}
.b-ok{background:var(--rest-soft);color:var(--rest)}
.b-planned{background:var(--surface2);color:var(--muted)}
.b-present{background:var(--rest-soft);color:var(--rest)}
.b-absent{background:var(--danger-soft);color:var(--danger)}
.b-makeup{background:var(--info-soft);color:var(--info)}
.b-done{background:var(--rest-soft);color:var(--rest)} .b-skipped{background:var(--conge-soft);color:var(--conge)}
.b-todo{background:var(--warn-soft);color:var(--warn)}

.tabs{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--surface2);border-radius:12px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 14px;border-radius:9px;cursor:pointer;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.tab.on{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.segc{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.segc button{border:0;background:var(--surface);padding:6px 11px;font-size:12px;font-weight:600;cursor:pointer;color:var(--muted);border-right:1px solid var(--line)}
.segc button:last-child{border-right:0}
.segc button.on{background:var(--accent);color:var(--accent-fg)}
.segc button.on.s-absent{background:var(--danger);color:#fff}.segc button.on.s-present{background:var(--rest);color:#fff}.segc button.on.s-makeup{background:var(--info);color:#fff}
.segc button:hover:not(.on){background:var(--surface2)}

.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface);width:100%;min-width:0}
.field textarea{min-height:64px;resize:vertical}
.fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.hint{font-size:12px;color:var(--muted)}
input[type=range]{accent-color:var(--accent);padding:0!important;border:0!important}

/* progression */
.bar{position:relative;height:9px;border-radius:99px;background:var(--surface2);overflow:hidden}
.bar i{position:absolute;top:0;bottom:0;left:0;background:var(--bc,var(--accent));border-radius:99px}
.bar i.pl{background:var(--bc,var(--accent));opacity:.3;border-radius:0}
.goal{display:flex;flex-direction:column;gap:6px}
.goal .gh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;font-weight:600}
.goal .gh span:last-child{font-size:12px;color:var(--muted);font-weight:500}
.c-fr{--bc:var(--c-fr)}.c-en{--bc:var(--c-en)}.c-ai{--bc:var(--c-ai)}.c-sport{--bc:var(--c-sport)}.c-other{--bc:var(--c-other)}.c-rattrapage{--bc:var(--c-rattrapage)}.c-full{--bc:var(--course)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bc);flex:none}
.tag{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;color:var(--bc);background:color-mix(in srgb,var(--bc) 14%,transparent)}

/* tableau de bord */
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:22px;align-items:center}
.hero .lab{font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.cd{font-family:var(--f-mono);font-weight:500;font-size:clamp(28px,5vw,44px);letter-spacing:-.02em;line-height:1.1;margin:4px 0}
.hero h2{font-size:22px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;font-size:13px}
.alert .ic{width:18px;height:18px;margin-top:1px}
.alert.danger{background:var(--danger-soft);color:var(--danger)}.alert.warn{background:var(--warn-soft);color:var(--warn)}.alert.info{background:var(--info-soft);color:var(--info)}
.alert span{color:var(--fg)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-weight:600;font-size:13px}
.banner.danger{background:var(--danger-soft);color:var(--danger)}

/* activités */
.act{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;background:var(--surface2)}
.act.done b{text-decoration:line-through;color:var(--muted)}
.act.skipped{opacity:.55}
.act.bad{outline:2px solid var(--danger)}
.act-b{display:flex;flex-direction:column;min-width:0;flex:1}
.act-b b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.act-b span{white-space:nowrap}
.tag{flex:none}
.chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--line);background:var(--surface);cursor:pointer;display:grid;place-items:center;flex:none;color:#fff;padding:0}
.act.done .chk{background:var(--rest);border-color:var(--rest)}
.chk .ic{width:15px;height:15px;stroke-width:3}

/* frise 24 h */
.tl{position:relative;height:22px;border-radius:7px;background:var(--surface2);overflow:hidden;margin-top:8px}
.tl i{position:absolute;top:0;bottom:0;display:block}
.tl .t-sleep{background:repeating-linear-gradient(135deg,transparent 0 4px,color-mix(in srgb,var(--muted) 30%,transparent) 4px 6px)}
.tl .t-day{background:var(--day)}.tl .t-night{background:var(--night)}
.tl .t-course{background:var(--course);top:3px;bottom:3px;border-radius:4px}
.tl .t-act{top:5px;bottom:5px;border-radius:4px;background:var(--bc);box-shadow:0 0 0 1.5px var(--surface)}
.tl .t-now{width:2px;background:var(--danger);top:-2px;bottom:-2px;z-index:3}
.tl-ax{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:11px;height:11px;border-radius:3px;background:var(--k,var(--muted));display:inline-block}

/* calendrier */
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mhead h2{flex:1;text-transform:capitalize}
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.mdow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase;letter-spacing:.05em;padding-bottom:3px}
.cell{display:flex;flex-direction:column;gap:2px;min-height:76px;padding:6px 7px;border-radius:10px;border:1px solid transparent;background:var(--ks,var(--surface2));cursor:pointer;text-align:left;min-width:0;position:relative;overflow:hidden}
.cell:hover{border-color:var(--k)}
.cell .n{font-weight:700;font-size:13px}
.cell .s{font-size:11px;font-weight:700;color:var(--k);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .ft{display:flex;align-items:center;gap:5px;margin-top:auto;font-size:11px;color:var(--muted)}
.cell .ft em{font-style:normal;font-weight:700}
.cell.out{opacity:.4}
.cell.today{border-color:var(--fg);box-shadow:0 0 0 1px var(--fg)}
.cdot{width:9px;height:9px;border-radius:50%;background:var(--rest);display:inline-block}
.cdot.conflict{background:var(--danger)}.cdot.afterNight{background:var(--recov)}
.ymonths{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.ym h3{text-transform:capitalize;margin-bottom:8px;cursor:pointer;background:none;border:0;padding:0;text-align:left;font-size:14px;font-family:var(--f-head);color:var(--fg)}
.ymg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini{aspect-ratio:1;border-radius:3px;background:var(--k);opacity:.9;display:block}
.mini.blank{background:none}
.mini.today{outline:2px solid var(--fg)}

.stat{display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--f-head);font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.yb{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:6px;align-items:end;height:150px}
.yb div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:10px;color:var(--muted)}
.yb i{display:block;width:100%;max-width:30px;background:var(--accent);border-radius:5px 5px 0 0;min-height:2px}
.yb b{font-size:10.5px;color:var(--fg);font-variant-numeric:tabular-nums}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.scroll-x{overflow-x:auto}

.sess{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 14px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--surface2)}
.sess.conflict{background:var(--danger-soft)}
.sess h3{font-size:14px}
.empty{padding:22px;text-align:center;color:var(--muted);border:1.5px dashed var(--line);border-radius:12px}
.weekgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.daycard{display:flex;flex-direction:column;gap:10px}
.daycard.today{outline:2px solid var(--accent)}

/* fenêtres */
.ov{position:fixed;inset:0;background:rgba(8,12,20,.55);display:flex;align-items:flex-start;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) 16px 16px;overflow-y:auto;z-index:50}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:560px;padding:20px;box-shadow:0 20px 60px rgba(0,0,0,.35);margin-block:auto;display:flex;flex-direction:column;gap:14px;min-width:0}
.modal.wide{max-width:680px}
.modal-h{display:flex;align-items:center;gap:10px}
.modal-h h2{flex:1}
.errs{display:flex;flex-direction:column;gap:6px}
textarea.code{font-family:var(--f-mono);font-size:11.5px;min-height:220px}
.toasts{position:fixed;left:0;right:0;bottom:calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:80;pointer-events:none;padding-inline:16px}
.toast{background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:13px;box-shadow:0 8px 30px rgba(0,0,0,.3);max-width:520px;animation:tin .2s ease-out}
.toast.warn{background:var(--warn);color:#fff}.toast.err{background:var(--danger);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}}
.res{display:flex;gap:8px;font-size:12.5px;align-items:flex-start}
.res .ok{color:var(--rest)}.res .ko{color:var(--danger)}

@media (max-width:900px){
  .app{display:block;padding-block:14px 96px}
  .side{display:none}
  .bottom{display:grid;grid-template-columns:repeat(6,1fr);position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .bnav{display:flex;flex-direction:column;align-items:center;gap:2px;border:0;background:none;padding:6px 0;font-size:10.5px;font-weight:600;color:var(--muted);cursor:pointer;border-radius:10px;min-width:0}
  .bnav.on{color:var(--accent)}
  .main{gap:14px}
  .toasts{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .top h1{font-size:22px}
  .hero,.g2,.g3{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:520px){
  .card{padding:14px}
  .mgrid{gap:3px}
  .cell{min-height:60px;padding:4px 5px}
  .cell .s{font-size:9.5px}
  .sess{grid-template-columns:minmax(0,1fr)}
  .weekgrid{grid-template-columns:minmax(0,1fr)}
  .gauto{grid-template-columns:minmax(0,1fr)}
}

</style>
</head><body>
<div id="app"></div>
<div id="modal"></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script>
/* =====================================================================
   MOTEUR — Smart Life Planner
   Fonctions pures : dates, cycle de rotation 12 h, conflits de cours,
   règles d'organisation, génération des activités, statistiques.
   Aucune dépendance au DOM. Les jours sont des entiers (jours depuis 1970,
   calculés en UTC) pour éviter tout décalage lié à l'heure d'été.
   ===================================================================== */
const E = (function () {
  'use strict';

  /* ---------- Outils de date ---------- */
  const pad = n => String(n).padStart(2, '0');
  const mod = (a, b) => ((a % b) + b) % b;
  const toDn = s => { const [y, m, d] = s.split('-').map(Number); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
  const fromDn = n => { const t = new Date(n * 86400000); return `${t.getUTCFullYear()}-${pad(t.getUTCMonth() + 1)}-${pad(t.getUTCDate())}`; };
  const parts = n => { const t = new Date(n * 86400000); return { y: t.getUTCFullYear(), m: t.getUTCMonth(), d: t.getUTCDate() }; };
  const dow = n => new Date(n * 86400000).getUTCDay();            // 0 = dimanche
  const tmin = s => { const [h, m] = s.split(':').map(Number); return h * 60 + m; };
  const mtime = m => `${pad(Math.floor(m / 60))}:${pad(m % 60)}`;
  const weekStart = n => n - mod(dow(n) + 6, 7);                  // lundi
  const todayDn = (now = new Date()) => toDn(`${now.getFullYear()}-${pad(now.getMonth() + 1)}-${pad(now.getDate())}`);
  const tsOf = (dn, min) => { const p = parts(dn); return new Date(p.y, p.m, p.d, 0, min, 0, 0); };
  const uid = () => Math.random().toString(36).slice(2, 10);

  const DAYS = ['Dimanche', 'Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi'];
  const DAYS_S = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
  const MONTHS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
  const dayLong = n => { const p = parts(n); return `${DAYS[dow(n)]} ${p.d} ${MONTHS[p.m]}`; };
  const dayShort = n => { const p = parts(n); return `${DAYS_S[dow(n)]} ${p.d}/${pad(p.m + 1)}`; };
  const fmtH = min => { const h = Math.floor(min / 60), m = Math.round(min % 60); return m ? `${h} h ${pad(m)}` : `${h} h`; };

  const TYPE_LABEL = { fr: 'Français', en: 'Anglais', ai: 'Intelligence artificielle', sport: 'Sport', other: 'Autre', rattrapage: 'Rattrapage Full Stack' };

  /* ---------- Cycle de rotation ----------
     Phases (une par jour calendaire) :
       0 = service de jour (09h–21h)
       1 = repos de 24 h, puis service de nuit à 21h
       2 = fin du service de nuit à 09h, 1re journée de repos (récupération)
       3 = 2e journée de repos
     Le cycle dure 4 jours. La phase de la date de référence est choisie
     par l'utilisateur : le cycle ne dépend jamais du jour de la semaine. */
  const PHASE_NAMES = ['Service de jour', 'Repos puis service de nuit', 'Récupération après la nuit', '2e journée de repos'];

  function phaseOf(dn, st) {
    const s = st.settings;
    return mod(Number(s.refPhase) + (dn - toDn(s.refDate)), 4);
  }
  const leavesOn = (dn, st) => st.leaves.filter(l => l.date === fromDn(dn));

  /* Service qui COMMENCE ce jour-là (null s'il n'y en a pas). */
  function serviceStarting(dn, st) {
    const base = ['day', 'night', null, null][phaseOf(dn, st)];
    const lv = leavesOn(dn, st);
    const off = lv.find(l => l.kind === 'conge' || l.kind === 'absence');
    const ren = lv.find(l => l.kind === 'renfort');
    if (base) return off ? { type: base, cancelled: off.kind } : { type: base };
    if (ren) return { type: ren.shift === 'night' ? 'night' : 'day', extra: true };
    return null;
  }
  const effService = (dn, st) => { const s = serviceStarting(dn, st); return s && !s.cancelled ? s : null; };

  /* Intervalle absolu (en minutes depuis l'époque) d'un service. */
  function absInterval(dn, svc, st) {
    const s = st.settings;
    const start = dn * 1440 + tmin(svc.type === 'day' ? s.dayStart : s.nightStart);
    return { s: start, e: start + Number(s.shiftHours) * 60 };
  }

  /* Plages occupées par le travail sur la journée dn (minutes 0..1440),
     y compris la fin d'un service de nuit commencé la veille. */
  function busy(dn, st) {
    const lo = dn * 1440, hi = lo + 1440, res = [];
    for (const d of [dn - 1, dn]) {
      const svc = effService(d, st);
      if (!svc) continue;
      const iv = absInterval(d, svc, st);
      const a = Math.max(iv.s, lo), b = Math.min(iv.e, hi);
      if (b > a) res.push({ s: a - lo, e: b - lo, type: svc.type, spill: d < dn, extra: !!svc.extra });
    }
    return res;
  }

  /* Nature de la journée, utilisée par toutes les règles d'organisation. */
  function dayInfo(dn, st) {
    const own = effService(dn, st);
    const raw = serviceStarting(dn, st);
    const b = busy(dn, st);
    const spill = b.some(x => x.spill);
    const phase = phaseOf(dn, st);
    let kind = 'rest';
    if (own) kind = own.type === 'day' ? 'day' : 'prenight';
    else if (spill) kind = 'recovery';
    let label, short;
    if (kind === 'day') { label = own.extra ? 'Renfort — service de jour' : 'Service de jour'; short = 'Jour'; }
    else if (kind === 'prenight') { label = own.extra ? 'Renfort — service de nuit à 21h' : 'Repos puis service de nuit à 21h'; short = 'Nuit'; }
    else if (kind === 'recovery') { label = 'Récupération après la nuit'; short = 'Récup.'; }
    else if (raw && raw.cancelled) { label = raw.cancelled === 'conge' ? 'Congé' : 'Absence'; short = raw.cancelled === 'conge' ? 'Congé' : 'Absent'; }
    else if (phase === 3) { label = '2e journée de repos'; short = 'Repos 2'; }
    else { label = 'Repos'; short = 'Repos'; }
    return { dn, date: fromDn(dn), phase, kind, label, short, own, cancelled: raw && raw.cancelled ? raw.cancelled : null, busy: b, leaves: leavesOn(dn, st) };
  }

  /* Liste des services commençant entre deux jours (avec horodatages réels). */
  function services(from, to, st) {
    const out = [];
    for (let d = from; d <= to; d++) {
      const s = effService(d, st);
      if (!s) continue;
      const iv = absInterval(d, s, st);
      out.push({ dn: d, type: s.type, extra: !!s.extra, start: tsOf(d, iv.s - d * 1440), end: tsOf(d, iv.e - d * 1440) });
    }
    return out;
  }
  function serviceStatus(now, st) {
    const t = todayDn(now);
    const list = services(t - 2, t + 16, st);
    return { cur: list.find(x => x.start <= now && now < x.end) || null, next: list.find(x => x.start > now) || null };
  }

  /* ---------- Cours fixes et conflits ---------- */
  function coursesOn(dn, st) {
    return st.settings.courses.filter(c => c.dow === dow(dn)).map(c => ({ date: fromDn(dn), dn, start: c.start, end: c.end, s: tmin(c.start), e: tmin(c.end) }));
  }
  /* cls : 'conflict' | 'afterNight' | 'ok' (+ tight si enchaînement serré avec la nuit) */
  function classifyCourse(dn, c, st) {
    const info = dayInfo(dn, st);
    const ov = info.busy.find(b => b.s < c.e && b.e > c.s);
    if (ov) return { cls: 'conflict', reason: ov.type === 'night' ? 'service de nuit' : 'service de jour', info };
    if (info.kind === 'recovery') return { cls: 'afterNight', reason: 'après un service de nuit', info };
    const tight = info.busy.some(b => !b.spill && b.type === 'night' && b.s >= c.e && b.s - c.e <= 60);
    return { cls: 'ok', tight, reason: tight ? 'enchaîne avec le service de nuit' : '', info };
  }
  function sessionsInRange(from, to, st) {
    const out = [];
    for (let d = from; d <= to; d++) {
      for (const c of coursesOn(d, st)) {
        const cl = classifyCourse(d, c, st);
        const rec = st.sessions[c.date];
        out.push({ ...c, cls: cl.cls, tight: !!cl.tight, reason: cl.reason, kind: cl.info.kind, status: rec ? rec.status : 'planned', makeup: st.makeups.find(m => m.sessionDate === c.date) || null });
      }
    }
    return out;
  }
  function nextCourse(now, st) {
    const t = todayDn(now);
    for (let d = t; d <= t + 21; d++) for (const c of coursesOn(d, st)) {
      if (tsOf(d, c.e) > now) { const cl = classifyCourse(d, c, st); return { ...c, cls: cl.cls, tight: !!cl.tight, reason: cl.reason, status: (st.sessions[c.date] || {}).status || 'planned' }; }
    }
    return null;
  }

  /* ---------- Statut des séances et rattrapages ---------- */
  function removeMakeup(st, mk) {
    st.makeups = st.makeups.filter(m => m !== mk);
    if (mk.activityId) st.activities = st.activities.filter(a => a.id !== mk.activityId);
  }
  function setSessionStatus(st, date, status) {
    st.sessions[date] = { status };
    const mk = st.makeups.find(m => m.sessionDate === date);
    if (status === 'absent') {
      if (!mk) st.makeups.push({ id: uid(), sessionDate: date, status: 'todo', planDate: null, activityId: null });
      else if (mk.status === 'done') mk.status = mk.activityId ? 'planned' : 'todo';
    } else if (status === 'makeup') {
      if (mk) mk.status = 'done'; else st.makeups.push({ id: uid(), sessionDate: date, status: 'done', planDate: null, activityId: null });
    } else if (mk) removeMakeup(st, mk);
  }
  function setActivityStatus(st, act, status) {
    act.status = status;
    if (act.makeupId) {
      const mk = st.makeups.find(m => m.id === act.makeupId);
      if (mk) {
        if (status === 'done') { mk.status = 'done'; st.sessions[mk.sessionDate] = { status: 'makeup' }; }
        else if (mk.status === 'done') { mk.status = 'planned'; st.sessions[mk.sessionDate] = { status: 'absent' }; }
      }
    }
  }

  /* ---------- Règles d'organisation ----------
     Fenêtres autorisées par type de journée (minutes), intensité maximale,
     durée maximale d'une activité, nombre maximal d'activités par jour. */
  const RULES = {
    day:       { win: [[1290, 1350]],                    max: 30,  cap: 1, sport: false,   base: -30 }, // 21h30–22h30, très court
    prenight:  { win: [[540, 720]],                      max: 60,  cap: 1, sport: false,   base: -5 },  // matinée légère, sommeil l'après-midi
    recovery:  { win: [[1050, 1290]],                    max: 60,  cap: 1, sport: 'light', base: -8 },  // 17h30–21h30, après le sommeil
    rest:      { win: [[480, 720], [840, 1140], [1140, 1290]], max: 120, cap: 5, sport: true, base: 10 }
  };
  const SLEEP = { day: [[1350, 1440]], prenight: [[780, 1110]], recovery: [[570, 1050]], rest: [] };
  const PREF = { ai: 600, en: 660, fr: 900, sport: 1050, rattrapage: 600 };

  const dur = a => tmin(a.end) - tmin(a.start);
  const overlap = (a, b, c, d) => a < d && c < b;

  /* Contrôle d'une activité (manuelle ou générée). */
  function validateActivity(act, st, ignoreId) {
    const errors = [], warnings = [];
    const dn = toDn(act.date), s = tmin(act.start), e = tmin(act.end);
    if (!(e > s)) { errors.push("L'heure de fin doit être après l'heure de début."); return { errors, warnings }; }
    const info = dayInfo(dn, st);
    const w = info.busy.find(b => overlap(s, e, b.s, b.e));
    if (w) errors.push(`Chevauche un ${w.type === 'night' ? 'service de nuit' : 'service de jour'} (${mtime(w.s)}–${mtime(w.e)}).`);
    const c = coursesOn(dn, st).find(c => overlap(s, e, c.s, c.e));
    if (c) errors.push(`Chevauche le cours Full Stack (${c.start}–${c.end}).`);
    st.activities.filter(a => a.id !== ignoreId && a.date === act.date && a.status !== 'skipped')
      .filter(a => overlap(s, e, tmin(a.start), tmin(a.end)))
      .forEach(a => warnings.push(`Chevauche « ${a.title} » (${a.start}–${a.end}).`));
    (SLEEP[info.kind] || []).forEach(([a, b]) => { if (overlap(s, e, a, b)) warnings.push('Tombe pendant la période de sommeil conseillée.'); });
    if (act.type === 'sport') {
      if (info.kind === 'recovery') warnings.push('Sport intensif déconseillé juste après un service de nuit.');
      if (info.kind === 'prenight') warnings.push('Évitez le sport la veille du service de nuit.');
      if (info.kind === 'day') warnings.push('Évitez le sport un jour de service.');
    }
    if (info.kind === 'day' && e - s > 30) warnings.push('Jour de service : privilégier le repos et des activités très courtes.');
    return { errors, warnings };
  }

  /* ---------- Planificateur ---------- */
  function occupied(dn, st) {
    const info = dayInfo(dn, st), occ = [];
    info.busy.forEach(b => occ.push([b.s - 15, b.e + 15]));
    coursesOn(dn, st).forEach(c => occ.push([c.s - 15, c.e + 15]));
    st.activities.forEach(a => { if (a.date === info.date && a.status !== 'skipped') occ.push([tmin(a.start), tmin(a.end)]); });
    return { info, occ };
  }
  const countOnDay = (dn, st) => st.activities.filter(a => a.date === fromDn(dn) && a.status !== 'skipped').length;

  function candidates(dn, type, minutes, st, ignoreCap) {
    const { info, occ } = occupied(dn, st), rule = RULES[info.kind], out = [];
    if (type === 'sport' && !rule.sport) return out;
    if (minutes > rule.max) return out;
    if (!ignoreCap && countOnDay(dn, st) >= rule.cap) return out;
    for (const [ws, we] of rule.win) {
      for (let s = ws; s + minutes <= we; s += 30) {
        if (!occ.some(([a, b]) => overlap(s, s + minutes, a, b))) out.push({ dn, start: s, end: s + minutes, kind: info.kind, rule });
      }
    }
    return out;
  }
  function score(c, type, st) {
    const same = st.activities.some(a => a.date === fromDn(c.dn) && a.type === type && a.status !== 'skipped');
    let sc = c.rule.base - countOnDay(c.dn, st) * 9 - (same ? (type === 'sport' ? 40 : 14) : 0) - Math.abs(c.start - (PREF[type] || 600)) / 30;
    if (type === 'ai' && c.kind === 'rest') sc += 12;
    if (type === 'sport') sc += c.kind === 'rest' ? 8 : (c.kind === 'recovery' ? -20 : 0);
    return sc;
  }
  function bestSlot(st, from, to, type, minutes, ignoreCap) {
    let best = null;
    for (let d = from; d <= to; d++) for (const c of candidates(d, type, minutes, st, ignoreCap)) {
      const sc = score(c, type, st);
      if (!best || sc > best.sc + 1e-9) best = { ...c, sc };
    }
    return best;
  }
  function makeActivity(st, c, type, extra) {
    const light = type === 'sport' && c.kind === 'recovery';
    return { id: uid(), date: fromDn(c.dn), start: mtime(c.start), end: mtime(c.end), type, title: TYPE_LABEL[type] + (light ? ' (léger)' : ''), status: 'planned', auto: true, locked: false, ...(extra || {}) };
  }

  /* Génère les activités manquantes d'une semaine (lundi = weekDn).
     Ne touche jamais aux activités faites, manuelles ou passées. */
  function planWeek(st, weekDn, today, replace = true) {
    const from = Math.max(weekDn, today), to = weekDn + 6, added = [], short = [];
    if (from > to) return { added, short };
    if (replace) st.activities = st.activities.filter(a => { const d = toDn(a.date); return !(a.auto && a.status === 'planned' && !a.makeupId && d >= from && d <= to); });
    const wk = st.activities.filter(a => { const d = toDn(a.date); return d >= weekDn && d <= to && a.status !== 'skipped'; });
    const have = t => wk.filter(a => a.type === t && (a.status === 'done' || (a.status === 'planned' && toDn(a.date) >= today)));
    const g = st.settings.goals, tasks = [];
    const sportNeed = Math.max(0, Number(g.sport) - have('sport').length);
    const need = {};
    ['ai', 'fr', 'en'].forEach(t => { need[t] = Math.max(0, Math.round(Number(g[t]) * 60 - have(t).reduce((s, a) => s + dur(a), 0))); });
    for (let i = 0; i < sportNeed; i++) {
      const c = bestSlot(st, from, to, 'sport', Number(st.settings.sportMin));
      if (c) { const a = makeActivity(st, c, 'sport'); st.activities.push(a); added.push(a); }
      else short.push({ type: 'sport', count: 1 });
    }
    const chunk = Number(st.settings.actMin) || 60;
    ['ai', 'fr', 'en'].forEach(t => {
      while (need[t] > 0) {
        let m = Math.min(chunk, need[t]);
        let c = bestSlot(st, from, to, t, m);
        if (!c && m > 30) { m = 30; c = bestSlot(st, from, to, t, m); }
        if (!c) { short.push({ type: t, min: need[t] }); break; }
        const a = makeActivity(st, c, t); st.activities.push(a); added.push(a); need[t] -= m;
      }
    });
    return { added, short };
  }
  function planWeeks(st, firstWeek, n, today, replace = true) {
    const all = { added: [], short: [] };
    for (let i = 0; i < n; i++) { const r = planWeek(st, firstWeek + 7 * i, today, replace); all.added.push(...r.added); all.short.push(...r.short.map(s => ({ ...s, week: firstWeek + 7 * i }))); }
    return all;
  }
  /* Après un changement de réglages : retire les activités générées devenues invalides. */
  function reconcile(st, today) {
    const before = st.activities.length;
    st.activities = st.activities.filter(a => !(a.auto && a.status === 'planned' && toDn(a.date) >= today && validateActivity(a, st, a.id).errors.length));
    return before - st.activities.length;
  }
  /* Proposition de créneau de rattrapage (durée du cours manqué). */
  function proposeMakeupSlot(st, mk, today) {
    const sd = toDn(mk.sessionDate);
    const c = st.settings.courses.find(c => c.dow === dow(sd)) || st.settings.courses[0];
    const minutes = tmin(c.end) - tmin(c.start);
    return bestSlot(st, Math.max(today, sd + 1), Math.max(today, sd + 1) + 28, 'rattrapage', minutes, true);
  }

  /* ---------- Progression et statistiques ---------- */
  function weekProgress(st, weekDn) {
    const to = weekDn + 6, g = st.settings.goals;
    const acts = st.activities.filter(a => { const d = toDn(a.date); return d >= weekDn && d <= to; });
    const res = {};
    ['fr', 'en', 'ai'].forEach(t => {
      const m = ty => acts.filter(a => a.type === t && a.status === ty).reduce((s, a) => s + dur(a), 0);
      res[t] = { done: m('done'), planned: m('planned'), goal: Number(g[t]) * 60 };
    });
    const c = ty => acts.filter(a => a.type === 'sport' && a.status === ty).length;
    res.sport = { done: c('done'), planned: c('planned'), goal: Number(g.sport) };
    const sess = sessionsInRange(weekDn, to, st);
    res.fullstack = {
      done: sess.filter(x => x.status === 'present' || x.status === 'makeup').reduce((s, x) => s + (x.e - x.s), 0),
      goal: st.settings.courses.reduce((s, c) => s + tmin(c.end) - tmin(c.start), 0),
      sessions: sess
    };
    return res;
  }
  function monthProgress(st, y, m) {
    const from = toDn(`${y}-${pad(m + 1)}-01`), days = new Date(Date.UTC(y, m + 1, 0)).getUTCDate(), to = from + days - 1;
    const g = st.settings.goals, acts = st.activities.filter(a => { const d = toDn(a.date); return d >= from && d <= to && a.status === 'done'; });
    const res = { days };
    ['fr', 'en', 'ai'].forEach(t => { res[t] = { done: acts.filter(a => a.type === t).reduce((s, a) => s + dur(a), 0), goal: Math.round(Number(g[t]) * 60 * days / 7) }; });
    res.sport = { done: acts.filter(a => a.type === 'sport').length, goal: Math.round(Number(g.sport) * days / 7) };
    return res;
  }
  function workStats(st, from, to) {
    const r = { day: 0, night: 0, extra: 0, conge: 0, absence: 0, hours: 0, rest: 0 };
    for (let d = from; d <= to; d++) {
      const raw = serviceStarting(d, st);
      if (raw && raw.cancelled) { r[raw.cancelled]++; continue; }
      if (raw) { r[raw.type]++; if (raw.extra) r.extra++; r.hours += Number(st.settings.shiftHours); } else r.rest++;
    }
    return r;
  }

  /* ---------- Alertes (notifications visuelles) ---------- */
  function computeAlerts(st, today, horizon = 21) {
    const al = [];
    const lvl = { danger: 0, warn: 1, info: 2 };
    sessionsInRange(today, today + horizon, st).forEach(x => {
      if (x.status === 'absent' || x.status === 'makeup') return;
      const lab = `${dayLong(x.dn)} ${x.start}–${x.end}`;
      if (x.cls === 'conflict') al.push({ level: 'danger', kind: 'conflict', dn: x.dn, text: `Cours en conflit avec le ${x.reason} : ${lab}.`, date: x.date });
      else if (x.cls === 'afterNight') al.push({ level: 'warn', kind: 'afterNight', dn: x.dn, text: `Cours après un service de nuit : ${lab}. Priorité au sommeil.`, date: x.date });
      else if (x.tight) al.push({ level: 'info', kind: 'tight', dn: x.dn, text: `Cours ${lab} : le service de nuit commence à la sortie.`, date: x.date });
    });
    st.activities.forEach(a => {
      if (a.status !== 'planned' || toDn(a.date) < today) return;
      const v = validateActivity(a, st, a.id);
      if (v.errors.length) al.push({ level: 'danger', kind: 'activity', dn: toDn(a.date), actId: a.id, text: `« ${a.title} » le ${dayShort(toDn(a.date))} : ${v.errors[0]}`, date: a.date });
    });
    const todo = st.makeups.filter(m => m.status !== 'done');
    if (todo.length) al.push({ level: 'warn', kind: 'makeups', dn: today, text: `${todo.length} cours à rattraper.` });
    sessionsInRange(Math.max(today - 28, st.settings.since ? toDn(st.settings.since) : -1e9), today - 1, st).filter(x => x.status === 'planned').forEach(x =>
      al.push({ level: 'info', kind: 'unrecorded', dn: x.dn, text: `Présence à renseigner : cours du ${dayShort(x.dn)}${x.cls === 'conflict' ? ` (conflit avec le ${x.reason})` : ''}.`, date: x.date }));
    const wp = weekProgress(st, weekStart(today));
    ['fr', 'en', 'ai'].forEach(t => {
      const lack = wp[t].goal - wp[t].done - wp[t].planned;
