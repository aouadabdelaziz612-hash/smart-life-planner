    return `<div class="act ${a.status} ${bad ? 'bad' : ''} c-${a.type}">
      <button class="chk" data-a="actToggle" data-id="${a.id}" aria-label="${a.status === 'done' ? 'Marquer à faire' : 'Marquer terminée'}">${a.status === 'done' ? icon('check') : ''}</button>
      <div class="act-b"><b>${esc(a.title)}</b><span class="mut sm num">${showDate ? E.dayShort(E.toDn(a.date)) + ' · ' : ''}${a.start}–${a.end}${a.auto ? ' · auto' : ''}</span></div>
      ${a.title.startsWith(T[a.type]) ? '' : `<span class="tag">${esc(T[a.type])}</span>`}
      <button class="ib sm" data-a="actEdit" data-id="${a.id}" aria-label="Modifier">${icon('edit')}</button>
    </div>`;
  }
  function sessionCard(x, compact) {
    const bk = x.makeup;
    return `<div class="sess ${x.cls === 'conflict' && x.status === 'planned' ? 'conflict' : ''}">
      <div class="stack" style="gap:6px">
        <h3>${E.dayLong(x.dn)} · ${x.start}–${x.end}</h3>
        <div class="row" style="gap:6px"><span class="chip b-${x.cls}">${CLS[x.cls]}</span>${x.reason ? `<span class="hint">${esc(x.cls === 'conflict' ? 'pendant le ' + x.reason : x.reason)}</span>` : ''}<span class="chip b-${x.status}">${ST[x.status]}</span>${bk && bk.status !== 'done' ? `<span class="chip b-todo">Rattrapage ${bk.status === 'planned' ? 'planifié' : 'à planifier'}</span>` : ''}</div>
      </div>
      ${seg('sess', Object.entries(ST), x.status, `data-d="${x.date}"`)}
    </div>`;
  }

  /* ---------- Vues ---------- */
  function vHome() {
    const now = new Date(), t = E.todayDn(now), { cur, next } = E.serviceStatus(now, S), info = E.dayInfo(t, S);
    const wp = E.weekProgress(S, E.weekStart(t)), nc = E.nextCourse(now, S), alerts = E.computeAlerts(S, t);
    const todays = S.activities.filter(a => a.date === E.fromDn(t) && a.status !== 'skipped').sort(byTime);
    const weekDone = S.activities.filter(a => { const d = E.toDn(a.date); return d >= E.weekStart(t) && d <= E.weekStart(t) + 6 && a.status === 'done'; }).length;
    const learnDone = wp.fr.done + wp.en.done + wp.ai.done, learnGoal = wp.fr.goal + wp.en.goal + wp.ai.goal;
    const todo = S.makeups.filter(m => m.status !== 'done');
    let h = `<div class="card hero"><div>`;
    if (cur) {
      h += `<div class="lab">En service</div><h2>${svcName(cur.type)}${cur.extra ? ' (renfort)' : ''}</h2><div class="cd" data-cd="${cur.end.getTime()}">${fmtCd(cur.end - now)}</div><div class="mut">avant la fin à ${clock(cur.end)}</div>`;
      if (next) h += `<p class="hint" style="margin-top:8px">Ensuite : ${svcName(next.type).toLowerCase()}, ${E.dayShort(next.dn)} à ${clock(next.start)}.</p>`;
    } else if (next) {
      h += `<div class="lab">Prochain service</div><h2>${svcName(next.type)}${next.extra ? ' (renfort)' : ''}</h2><div class="cd" data-cd="${next.start.getTime()}">${fmtCd(next.start - now)}</div><div class="mut">${E.dayLong(next.dn)} à ${clock(next.start)} → ${clock(next.end)}</div>`;
    } else h += `<div class="lab">Prochain service</div><h2>Aucun service prévu</h2>`;
    h += `</div><div><div class="row"><span class="lab">Aujourd'hui</span><span class="sp"></span>${kindChip(info)}</div>${timeline(t)}</div></div>`;

    const top = alerts.filter(a => a.level !== 'info' || true).slice(0, 6);
    h += `<div class="grid g2"><div class="card"><div class="card-h"><h3>Objectifs de la semaine</h3><span class="hint">${E.fmtH(learnDone)} / ${E.fmtH(learnGoal)} d'apprentissage</span></div><div class="stack" style="gap:14px">
      ${['fr', 'en', 'ai'].map(k => `<div class="goal c-${k}"><div class="gh"><span>${T[k]}</span><span class="num">${E.fmtH(wp[k].done)} faites · ${E.fmtH(wp[k].planned)} prévues / ${E.fmtH(wp[k].goal)}</span></div>${bar(wp[k].done, wp[k].planned, wp[k].goal)}</div>`).join('')}
      <div class="goal c-sport"><div class="gh"><span>Sport</span><span class="num">${wp.sport.done} faite(s) · ${wp.sport.planned} prévue(s) / ${wp.sport.goal} séances</span></div>${bar(wp.sport.done, wp.sport.planned, wp.sport.goal)}</div>
      <div class="goal c-full"><div class="gh"><span>Formation Full Stack</span><span class="num">${E.fmtH(wp.fullstack.done)} suivies / ${E.fmtH(wp.fullstack.goal)}</span></div>${bar(wp.fullstack.done, 0, wp.fullstack.goal)}</div></div></div>
      <div class="stack">
      <div class="card"><div class="card-h"><h3>Prochain cours</h3><button class="btn sm" data-a="go" data-v="acad">Formation</button></div>
        ${nc ? `<div class="stack" style="gap:8px"><b>${E.dayLong(nc.dn)} · ${nc.start}–${nc.end}</b><div class="row" style="gap:6px"><span class="chip b-${nc.cls}">${CLS[nc.cls]}</span><span class="chip b-${nc.status}">${ST[nc.status]}</span></div>${nc.reason ? `<p class="hint">${esc(nc.cls === 'conflict' ? 'Pendant le ' + nc.reason + '.' : nc.reason + '.')}</p>` : ''}</div>` : '<p class="mut">Aucun cours dans les 3 prochaines semaines.</p>'}</div>
      <div class="card"><div class="card-h"><h3>Aujourd'hui</h3><button class="btn sm" data-a="actNew" data-d="${E.fromDn(t)}">${icon('plus')}Activité</button></div>
        <div class="stack" style="gap:8px">${todays.length ? todays.map(a => actRow(a)).join('') : `<p class="mut">Aucune activité prévue${['day', 'prenight', 'recovery'].includes(info.kind) ? ' : journée à préserver.' : '.'}</p>`}</div>
        <p class="hint" style="margin-top:10px">${weekDone} activité(s) terminée(s) cette semaine · ${wp.sport.done} séance(s) de sport.</p></div></div></div>`;

    h += `<div class="grid g2"><div class="card"><div class="card-h"><h3>Alertes</h3><span class="hint">${top.length ? top.length + ' en cours' : ''}</span></div><div class="stack" style="gap:8px">${top.length ? top.map(a => `<div class="alert ${a.level}">${icon('alert')}<span>${esc(a.text)}</span></div>`).join('') : '<p class="mut">Aucun conflit à signaler dans les 3 prochaines semaines.</p>'}</div></div>
      <div class="card"><div class="card-h"><h3>Cours à rattraper</h3><span class="chip ${todo.length ? 'b-todo' : 'b-ok'}">${todo.length}</span></div>
        ${todo.length ? `<div class="stack" style="gap:8px">${todo.slice(0, 4).map(m => `<div class="row"><span>Cours du ${E.dayShort(E.toDn(m.sessionDate))}</span><span class="sp"></span><span class="chip b-todo">${m.status === 'planned' ? 'Planifié' : 'À planifier'}</span></div>`).join('')}<button class="btn sm" data-a="acadGo">Planifier les rattrapages</button></div>` : '<p class="mut">Rien à rattraper.</p>'}</div></div>`;
    return h;
  }

  /* --- Planning professionnel --- */
  function vPro() {
    let h = tabs('proSub', [['month', 'Mois'], ['year', 'Année'], ['stats', 'Statistiques'], ['leaves', 'Congés & renforts'], ['journal', 'Journal']], U.proSub);
    if (U.proSub === 'month') h += proMonth(); else if (U.proSub === 'year') h += proYear(); else if (U.proSub === 'stats') h += proStats();
    else if (U.proSub === 'leaves') h += proLeaves(); else h += proJournal();
    return h;
  }
  function proMonth() {
    const g = E.monthGrid(U.mY, U.mM), t = E.todayDn();
    const ws = E.workStats(S, g.first, g.last);
    let h = `<div class="card"><div class="mhead"><button class="ib" data-a="mprev" aria-label="Mois précédent">${icon('left')}</button><h2>${E.MONTHS[U.mM]} ${U.mY}</h2><button class="btn sm" data-a="mtoday">Aujourd'hui</button><button class="ib" data-a="mnext" aria-label="Mois suivant">${icon('right')}</button></div>
      <div class="mgrid">${['Lun', 'Mar', 'Mer', 'Jeu', 'Ven', 'Sam', 'Dim'].map(d => `<div class="mdow">${d}</div>`).join('')}`;
    g.days.forEach(d => {
      const info = E.dayInfo(d, S), p = E.parts(d), cs = E.coursesOn(d, S), cc = cs.length ? E.classifyCourse(d, cs[0], S).cls : '';
      const na = S.activities.filter(a => a.date === info.date && a.status !== 'skipped').length;
      h += `<button class="cell ${kcls(info)} ${d < g.first || d > g.last ? 'out' : ''} ${d === t ? 'today' : ''}" data-a="day" data-d="${info.date}" aria-label="${E.dayLong(d)} : ${esc(info.label)}"><span class="n">${p.d}</span><span class="s">${esc(info.short)}</span><span class="ft">${cs.length ? `<i class="cdot ${cc}" title="Cours ${CLS[cc]}"></i>` : ''}${na ? `<em>${na}</em>` : ''}</span></button>`;
    });
    h += `</div></div><div class="card"><div class="row" style="gap:22px"><div class="stat"><b>${ws.day}</b><span>services de jour</span></div><div class="stat"><b>${ws.night}</b><span>services de nuit</span></div><div class="stat"><b>${ws.hours} h</b><span>heures travaillées</span></div><div class="stat"><b>${ws.rest}</b><span>jours de repos</span></div></div><div style="margin-top:14px">${legend()}</div></div>`;
    return h;
  }
  function proYear() {
    const t = E.todayDn();
    let h = `<div class="card"><div class="mhead"><button class="ib" data-a="yprev" aria-label="Année précédente">${icon('left')}</button><h2>${U.yY}</h2><button class="ib" data-a="ynext" aria-label="Année suivante">${icon('right')}</button></div><div class="ymonths">`;
    for (let m = 0; m < 12; m++) {
      const g = E.monthGrid(U.yY, m);
      h += `<div class="ym"><button data-a="openMonth" data-m="${m}">${E.MONTHS[m]}</button><div class="ymg">`;
      g.days.forEach(d => {
        if (d < g.first || d > g.last) { h += '<i class="mini blank"></i>'; return; }
        const info = E.dayInfo(d, S);
        h += `<i class="mini ${kcls(info)} ${d === t ? 'today' : ''}" title="${esc(E.dayShort(d) + ' · ' + info.label)}"></i>`;
      });
      h += '</div></div>';
    }
    return h + `</div><div style="margin-top:16px">${legend()}</div></div>`;
  }
  function proStats() {
    const g = E.monthGrid(U.mY, U.mM), ws = E.workStats(S, g.first, g.last);
    const extra = Object.keys(S.journal).filter(k => k.slice(0, 7) === `${U.mY}-${pad(U.mM + 1)}`).reduce((s, k) => s + (Number(S.journal[k].extra) || 0), 0);
    const rows = [];
    for (let m = 0; m < 12; m++) { const q = E.monthGrid(U.mY, m); rows.push({ m, ...E.workStats(S, q.first, q.last) }); }
    const max = Math.max(1, ...rows.map(r => r.hours));
    const tot = rows.reduce((a, r) => ({ day: a.day + r.day, night: a.night + r.night, hours: a.hours + r.hours, conge: a.conge + r.conge, absence: a.absence + r.absence, extra: a.extra + r.extra }), { day: 0, night: 0, hours: 0, conge: 0, absence: 0, extra: 0 });
    return `<div class="card"><div class="mhead"><button class="ib" data-a="mprev" aria-label="Mois précédent">${icon('left')}</button><h2>${E.MONTHS[U.mM]} ${U.mY}</h2><button class="ib" data-a="mnext" aria-label="Mois suivant">${icon('right')}</button></div>
      <div class="grid gauto" style="grid-template-columns:repeat(auto-fit,minmax(120px,1fr))"><div class="stat"><b>${ws.day}</b><span>services de jour</span></div><div class="stat"><b>${ws.night}</b><span>services de nuit</span></div><div class="stat"><b>${ws.hours} h</b><span>heures de service</span></div><div class="stat"><b>${ws.conge + ws.absence}</b><span>congés / absences</span></div><div class="stat"><b>${ws.extra}</b><span>renforts</span></div><div class="stat"><b>${E.fmtH(extra)}</b><span>heures sup. saisies</span></div></div></div>
      <div class="card"><div class="card-h"><h3>Heures de service en ${U.mY}</h3><span class="hint">${tot.hours} h · ${tot.day} jours · ${tot.night} nuits</span></div>
      <div class="yb">${rows.map(r => `<div><b>${r.hours}</b><i style="height:${Math.max(2, r.hours / max * 100 * .72)}%"></i><span>${E.MONTHS[r.m].slice(0, 3)}</span></div>`).join('')}</div></div>
      <div class="card scroll-x"><table class="tbl"><thead><tr><th>Mois</th><th>Jours</th><th>Nuits</th><th>Heures</th><th>Congés</th><th>Absences</th><th>Renforts</th></tr></thead><tbody>${rows.map(r => `<tr><td>${E.MONTHS[r.m]}</td><td>${r.day}</td><td>${r.night}</td><td>${r.hours}</td><td>${r.conge}</td><td>${r.absence}</td><td>${r.extra}</td></tr>`).join('')}</tbody></table></div>`;
  }
  function proLeaves() {
    const list = [...S.leaves].sort((a, b) => b.date.localeCompare(a.date));
    const L = { conge: 'Congé', absence: 'Absence', renfort: 'Renfort' };
    return `<div class="card"><div class="card-h"><h3>Ajouter</h3></div><div class="fgrid">
      <div class="field"><label for="lv-kind">Type</label><select id="lv-kind"><option value="conge">Congé</option><option value="absence">Absence</option><option value="renfort">Renfort (service supplémentaire)</option></select></div>
      <div class="field"><label for="lv-from">Du</label><input id="lv-from" type="date" value="${E.fromDn(E.todayDn())}"></div>
      <div class="field"><label for="lv-to">Au (facultatif)</label><input id="lv-to" type="date"></div>
      <div class="field"><label for="lv-shift">Renfort : service</label><select id="lv-shift"><option value="day">Jour 09h–21h</option><option value="night">Nuit 21h–09h</option></select></div></div>
      <p class="hint" style="margin:10px 0">Un congé ou une absence annule les services qui commencent ces jours-là. Un renfort ajoute un service un jour de repos.</p>
      <button class="btn pri" data-a="leaveAdd">${icon('plus')}Ajouter</button></div>
      <div class="card"><div class="card-h"><h3>Congés, absences et renforts</h3><span class="hint">${list.length} entrée(s)</span></div>
      <div class="stack" style="gap:8px">${list.length ? list.map(l => `<div class="act"><div class="act-b"><b>${E.dayLong(E.toDn(l.date))} ${E.parts(E.toDn(l.date)).y}</b><span class="mut sm">${L[l.kind]}${l.kind === 'renfort' ? ' · ' + (l.shift === 'night' ? 'nuit' : 'jour') : ''}</span></div><span class="chip ${l.kind === 'renfort' ? 'k-day' : 'k-conge'}">${L[l.kind]}</span><button class="ib sm" data-a="leaveDel" data-id="${l.id}" aria-label="Supprimer">${icon('trash')}</button></div>`).join('') : '<div class="empty">Aucun congé, absence ni renfort enregistré.</div>'}</div></div>`;
  }
  function proJournal() {
    const now = new Date(), t = E.todayDn(now), list = E.services(t - 30, t, S).filter(s => s.start <= now).reverse();
    return `<div class="card"><div class="card-h"><h3>Journal des services</h3><span class="hint">30 derniers jours</span></div><div class="stack">${list.length ? list.map(s => {
      const key = `${E.fromDn(s.dn)}|${s.type}`, j = S.journal[key] || {};
      return `<div class="act" style="align-items:flex-start;flex-wrap:wrap"><div class="act-b" style="min-width:160px"><b>${E.dayLong(s.dn)}</b><span class="mut sm">${svcName(s.type)}${s.extra ? ' (renfort)' : ''} · ${clock(s.start)} → ${clock(s.end)}</span></div>
        <div class="field" style="flex:2;min-width:200px"><label for="jn-${key}">Note</label><input id="jn-${key}" data-c="jnote" data-key="${key}" value="${esc(j.note || '')}" placeholder="Poste, événements, remarques…"></div>
        <div class="field" style="width:110px"><label for="je-${key}">Heures sup. (min)</label><input id="je-${key}" type="number" min="0" step="15" data-c="jextra" data-key="${key}" value="${esc(j.extra || '')}"></div></div>`;
    }).join('') : '<div class="empty">Aucun service passé dans les 30 derniers jours.</div>'}</div></div>`;
  }

  /* --- Formation --- */
  function vAcad() {
    let h = tabs('acadSub', [['courses', 'Cours'], ['makeups', 'Rattrapages'], ['progress', 'Progression']], U.acadSub);
    if (U.acadSub === 'courses') h += acadCourses(); else if (U.acadSub === 'makeups') h += acadMakeups(); else h += acadProgress();
    return h;
  }
  function acadCourses() {
    const t = E.todayDn(), f = U.sf;
    let from = t, to = t + 56;
    if (f.when === 'past') { from = t - 84; to = t - 1; } else if (f.when === 'all') { from = t - 84; to = t + 56; }
    let list = E.sessionsInRange(from, to, S).filter(x => (f.cls === 'all' || x.cls === f.cls) && (f.status === 'all' || x.status === f.status));
    if (f.when !== 'future') list.reverse();
    const n = { conflict: 0, afterNight: 0, ok: 0 }; E.sessionsInRange(t, t + 56, S).forEach(x => n[x.cls]++);
    return `<div class="card"><div class="row"><div class="field"><label for="sf-when">Période</label><select id="sf-when" data-c="sf" data-f="when"><option value="future" ${f.when === 'future' ? 'selected' : ''}>8 prochaines semaines</option><option value="past" ${f.when === 'past' ? 'selected' : ''}>12 dernières semaines</option><option value="all" ${f.when === 'all' ? 'selected' : ''}>Tout</option></select></div>
      <div class="field"><label for="sf-cls">Classement</label><select id="sf-cls" data-c="sf" data-f="cls"><option value="all">Tous</option>${Object.entries(CLS).map(([k, v]) => `<option value="${k}" ${f.cls === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="sf-st">Statut</label><select id="sf-st" data-c="sf" data-f="status"><option value="all">Tous</option>${Object.entries(ST).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <span class="sp"></span><div class="row" style="gap:6px"><span class="chip b-ok">${n.ok} sans conflit</span><span class="chip b-conflict">${n.conflict} en conflit</span><span class="chip b-afterNight">${n.afterNight} après nuit</span></div></div></div>
      <p class="hint">Les cours du lundi et du mardi (19h–21h) sont fixes : ils ne sont jamais déplacés. Marquez « Absent » pour créer automatiquement une tâche de rattrapage.</p>
      <div class="stack">${list.length ? list.map(x => sessionCard(x)).join('') : '<div class="empty">Aucun cours ne correspond à ces filtres.</div>'}</div>`;
  }
  function acadMakeups() {
    const t = E.todayDn(), list = [...S.makeups].sort((a, b) => a.sessionDate.localeCompare(b.sessionDate));
    const unrec = E.sessionsInRange(Math.max(t - 56, S.settings.since ? E.toDn(S.settings.since) : -1e9), t - 1, S).filter(x => x.status === 'planned' && x.cls !== 'ok');
    const act = m => S.activities.find(a => a.id === m.activityId);
    let h = `<div class="card"><div class="card-h"><h3>Cours manqués et rattrapages</h3><span class="hint">${list.filter(m => m.status !== 'done').length} à rattraper</span></div><div class="stack">`;
    h += list.length ? list.map(m => {
      const a = act(m), sd = E.toDn(m.sessionDate);
      return `<div class="sess"><div class="stack" style="gap:6px"><h3>Cours du ${E.dayLong(sd)}</h3><div class="row" style="gap:6px"><span class="chip b-${m.status === 'done' ? 'makeup' : 'todo'}">${m.status === 'done' ? 'Rattrapage effectué' : m.status === 'planned' ? 'Rattrapage planifié' : 'À planifier'}</span>${a ? `<span class="hint">${E.dayLong(E.toDn(a.date))}, ${a.start}–${a.end}</span>` : ''}</div></div>
        <div class="row" style="gap:6px">${m.status === 'todo' ? `<button class="btn sm pri" data-a="mkPropose" data-id="${m.id}">${icon('wand')}Proposer un créneau</button><button class="btn sm" data-a="mkManual" data-id="${m.id}">Choisir</button>` : ''}${m.status === 'planned' && a ? `<button class="btn sm" data-a="actEdit" data-id="${a.id}">Modifier</button><button class="btn sm pri" data-a="actToggle" data-id="${a.id}">Fait</button>` : ''}${m.status !== 'done' ? `<button class="btn sm" data-a="mkDone" data-id="${m.id}">Marquer rattrapé</button>` : ''}</div></div>`;
    }).join('') : '<div class="empty">Aucun cours manqué. Quand vous marquez un cours « Absent », une tâche de rattrapage apparaît ici.</div>';
    h += '</div></div>';
    if (unrec.length) h += `<div class="card"><div class="card-h"><h3>À vérifier</h3><span class="hint">Cours passés non renseignés, en conflit ou après une nuit</span></div><div class="stack">${unrec.map(x => sessionCard(x)).join('')}</div></div>`;
    return h;
  }
  function acadProgress() {
    const t = E.todayDn(), all = E.sessionsInRange(t - 365, t, S).filter(x => E.tsOf(x.dn, x.e) <= new Date());
    const c = k => all.filter(x => x.status === k).length;
    const pres = c('present') + c('makeup'), rated = all.filter(x => x.status !== 'planned').length;
    const avg = S.modules.length ? Math.round(S.modules.reduce((s, m) => s + m.pct, 0) / S.modules.length) : 0;
    const wp = E.weekProgress(S, E.weekStart(t)).fullstack;
    return `<div class="card"><div class="card-h"><h3>Présence</h3><span class="hint">sur les 12 derniers mois</span></div><div class="row" style="gap:26px">
      <div class="stat"><b>${rated ? Math.round(pres / rated * 100) : 0} %</b><span>assiduité (${pres}/${rated})</span></div><div class="stat"><b>${c('present')}</b><span>présent</span></div><div class="stat"><b>${c('absent')}</b><span>absent</span></div><div class="stat"><b>${c('makeup')}</b><span>rattrapés</span></div><div class="stat"><b>${E.fmtH(pres * 120)}</b><span>de cours suivis</span></div></div>
      <div class="goal c-full" style="margin-top:14px"><div class="gh"><span>Cette semaine</span><span class="num">${E.fmtH(wp.done)} / ${E.fmtH(wp.goal)}</span></div>${bar(wp.done, 0, wp.goal)}</div></div>
      <div class="card"><div class="card-h"><h3>Progression Full Stack</h3><span class="chip b-ok">${avg} %</span></div><div class="goal c-full">${bar(avg, 0, 100)}</div>
      <div class="stack" style="margin-top:14px;gap:12px">${S.modules.map(m => `<div class="goal c-full"><div class="row" style="gap:8px"><input class="field" style="flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)" aria-label="Nom du module" data-c="modName" data-id="${m.id}" value="${esc(m.name)}"><b class="num" style="width:44px;text-align:right">${m.pct} %</b><button class="ib sm" data-a="modDel" data-id="${m.id}" aria-label="Supprimer le module">${icon('trash')}</button></div><input type="range" min="0" max="100" step="5" value="${m.pct}" aria-label="Avancement de ${esc(m.name)}" data-c="modPct" data-id="${m.id}"></div>`).join('')}
      <div class="row"><input id="mod-new" placeholder="Nouveau module" aria-label="Nouveau module" style="flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface)"><button class="btn" data-a="modAdd">${icon('plus')}Ajouter</button></div></div></div>`;
  }

  /* --- Développement personnel --- */
  function vPerso() {
    const t = E.todayDn(), wk = E.weekStart(t), wp = E.weekProgress(S, wk), mp = E.monthProgress(S, new Date().getFullYear(), new Date().getMonth());
    const acts = S.activities.filter(a => { const d = E.toDn(a.date); return d >= wk && d <= wk + 6 && a.status !== 'skipped'; }).sort(byTime);
    const card = k => {
      const w = wp[k], m = mp[k], isS = k === 'sport', fmt = v => isS ? v + '' : E.fmtH(v);
      const list = acts.filter(a => a.type === k);
      return `<div class="card c-${k}"><div class="card-h"><h3>${isS ? 'Sport' : T[k]}</h3><button class="btn sm" data-a="actNew" data-d="${E.fromDn(t)}" data-t="${k}">${icon('plus')}Ajouter</button></div>
        <div class="stack" style="gap:12px"><div class="goal"><div class="gh"><span>Semaine</span><span class="num">${fmt(w.done)} faite(s) · ${fmt(w.planned)} prévue(s) / ${fmt(w.goal)}${isS ? ' séances' : ''}</span></div>${bar(w.done, w.planned, w.goal)}</div>
        <div class="goal"><div class="gh"><span>Mois</span><span class="num">${fmt(m.done)} / ${fmt(m.goal)}${isS ? ' séances' : ''}</span></div>${bar(m.done, 0, m.goal)}</div>
        <div class="stack" style="gap:6px">${list.length ? list.map(a => actRow(a, true)).join('') : '<p class="mut sm">Rien de planifié cette semaine.</p>'}</div></div></div>`;
    };
    let hist = '';
    for (let i = 5; i >= 0; i--) {
      const w = wk - 7 * i, p = E.weekProgress(S, w), tot = ['fr', 'en', 'ai'].reduce((s, k) => s + p[k].done, 0), goal = ['fr', 'en', 'ai'].reduce((s, k) => s + p[k].goal, 0);
      hist += `<div class="goal"><div class="gh"><span>Semaine du ${E.parts(w).d}/${pad(E.parts(w).m + 1)}</span><span class="num">${E.fmtH(tot)} / ${E.fmtH(goal)} · sport ${p.sport.done}/${p.sport.goal}</span></div>${bar(tot, 0, goal)}</div>`;
    }
    return `<div class="row"><p class="mut" style="flex:1;min-width:200px">Objectifs : ${S.settings.goals.fr} h de français, ${S.settings.goals.en} h d'anglais, ${S.settings.goals.ai} h d'IA et ${S.settings.goals.sport} séances de sport par semaine.</p><button class="btn pri" data-a="planWeek" data-w="${wk}">${icon('wand')}Planifier la semaine</button></div>
      <div class="grid gauto">${['fr', 'en', 'ai', 'sport'].map(card).join('')}</div>
      <div class="card"><div class="card-h"><h3>Apprentissage : 6 dernières semaines</h3><span class="hint">français + anglais + IA</span></div><div class="stack" style="gap:12px">${hist}</div></div>`;
  }

  /* --- Agenda --- */
  function vAgenda() {
    let h = tabs('agSub', [['week', 'Semaine'], ['list', 'Liste filtrée']], U.agSub);
    if (U.agSub === 'week') {
      const w = U.weekDn, p1 = E.parts(w), p2 = E.parts(w + 6), t = E.todayDn();
      h += `<div class="card"><div class="row"><button class="ib" data-a="wprev" aria-label="Semaine précédente">${icon('left')}</button><h3 style="flex:1;text-align:center;min-width:150px">Du ${p1.d} ${p1.m === p2.m ? '' : E.MONTHS[p1.m]} au ${p2.d} ${E.MONTHS[p2.m]} ${p2.y}</h3><button class="ib" data-a="wnext" aria-label="Semaine suivante">${icon('right')}</button><button class="btn sm" data-a="wtoday">Cette semaine</button></div>
        <div class="row" style="margin-top:12px"><button class="btn pri sm" data-a="planWeek" data-w="${w}">${icon('wand')}Planifier la semaine</button><button class="btn sm" data-a="planAhead" data-w="${w}">Planifier 4 semaines</button><button class="btn sm dng" data-a="clearAuto" data-w="${w}">Vider le planning auto</button></div>
        <p class="hint" style="margin-top:8px">La planification répartit les activités selon la nature de chaque journée. Les activités terminées ou modifiées à la main ne sont jamais supprimées.</p></div><div class="weekgrid">`;
      for (let d = w; d <= w + 6; d++) {
        const info = E.dayInfo(d, S), cs = E.coursesOn(d, S), acts = S.activities.filter(a => a.date === info.date).sort(byTime);
        h += `<div class="card daycard ${d === t ? 'today' : ''}"><div class="row"><button class="btn sm" style="border:0;padding:0;font-size:15px;font-family:var(--f-head)" data-a="day" data-d="${info.date}">${E.dayLong(d)}</button><span class="sp"></span><button class="ib sm" data-a="actNew" data-d="${info.date}" aria-label="Ajouter une activité">${icon('plus')}</button></div>${kindChip(info)}${timeline(d)}
          ${cs.map(c => { const cl = E.classifyCourse(d, c, S), st = (S.sessions[c.date] || {}).status || 'planned'; return `<div class="row" style="gap:6px"><span class="chip b-${cl.cls}">Cours ${c.start}–${c.end}</span><span class="chip b-${st}">${ST[st]}</span></div>`; }).join('')}
          <div class="stack" style="gap:6px">${acts.map(a => actRow(a)).join('')}</div></div>`;
      }
      return h + '</div>';
    }
    const f = U.flt, from = f.from ? E.toDn(f.from) : -1e9, to = f.to ? E.toDn(f.to) : 1e9;
    const list = S.activities.filter(a => { const d = E.toDn(a.date); return d >= from && d <= to && (f.type === 'all' || a.type === f.type) && (f.status === 'all' || a.status === f.status); }).sort(byTime);
    return h + `<div class="card"><div class="fgrid"><div class="field"><label for="f-from">Du</label><input id="f-from" type="date" data-c="flt" data-f="from" value="${f.from}"></div><div class="field"><label for="f-to">Au</label><input id="f-to" type="date" data-c="flt" data-f="to" value="${f.to}"></div>
      <div class="field"><label for="f-type">Activité</label><select id="f-type" data-c="flt" data-f="type"><option value="all">Toutes</option>${Object.entries(T).map(([k, v]) => `<option value="${k}" ${f.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="f-st">Statut</label><select id="f-st" data-c="flt" data-f="status"><option value="all">Tous</option>${Object.entries(AST).map(([k, v]) => `<option value="${k}" ${f.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div></div>
      <div class="row" style="margin-top:12px"><span class="hint">${list.length} activité(s)</span><span class="sp"></span><button class="btn sm" data-a="fltReset">Réinitialiser</button><button class="btn sm pri" data-a="actNew" data-d="${E.fromDn(E.todayDn())}">${icon('plus')}Nouvelle activité</button></div></div>
      <div class="stack" style="gap:8px">${list.length ? list.slice(0, 200).map(a => actRow(a, true)).join('') : '<div class="empty">Aucune activité ne correspond à ces filtres.</div>'}</div>`;
  }

  /* --- Réglages --- */
  const PHASE_OPT = ['Je suis en service de jour ce jour-là (09h–21h)', 'Je commence un service de nuit ce jour-là (21h)', '1re journée de repos : ma nuit s\'est terminée à 09h', '2e journée de repos'];
  function preview(ref, phase, n = 8) {
    const st = { ...S, settings: { ...S.settings, refDate: ref, refPhase: phase }, leaves: [] };
    return `<div class="row" style="gap:6px">${Array.from({ length: n }, (_, i) => { const d = E.toDn(ref) + i, info = E.dayInfo(d, st); return `<div class="chip ${kcls(info)}" style="flex-direction:column;gap:0;padding:6px 10px;border-radius:10px;min-width:64px"><span style="font-size:11px;opacity:.8">${E.DAYS_S[E.dow(d)]} ${E.parts(d).d}</span><span>${esc(info.short)}</span></div>`; }).join('')}</div>`;
  }
  function refForm(ref, phase) {
    return `<div class="fgrid"><div class="field"><label for="st-ref">Date de référence</label><input id="st-ref" type="date" class="livep" value="${ref}"></div>
      <div class="field" style="grid-column:span 2;min-width:240px"><label for="st-phase">Situation à cette date</label><select id="st-phase" class="livep">${PHASE_OPT.map((o, i) => `<option value="${i}" ${Number(phase) === i ? 'selected' : ''}>${o}</option>`).join('')}</select></div></div>
      <div style="margin-top:12px"><div class="hint" style="margin-bottom:6px">Aperçu des 8 jours à partir de la date de référence :</div><div id="st-prev">${preview(ref, Number(phase))}</div></div>`;
  }
  function vSettings() {
    const s = S.settings;
    return `<div class="card"><div class="card-h"><h3>Cycle de travail</h3></div>${refForm(s.refDate, s.refPhase)}
      <p class="hint" style="margin-top:10px">Cycle de 4 jours : service de jour (09h–21h), 24 h de repos puis service de nuit (21h–09h), première journée de repos, deuxième journée de repos. Il n'est jamais lié au lundi.</p></div>
      <div class="card"><div class="card-h"><h3>Objectifs hebdomadaires</h3></div><div class="fgrid">
        ${[['fr', 'Français (heures)'], ['en', 'Anglais (heures)'], ['ai', 'Intelligence artificielle (heures)'], ['sport', 'Sport (séances)']].map(([k, l]) => `<div class="field"><label for="g-${k}">${l}</label><input id="g-${k}" type="number" min="0" max="20" step="0.5" value="${s.goals[k]}"></div>`).join('')}
        <div class="field"><label for="g-sportMin">Durée d'une séance de sport (min)</label><input id="g-sportMin" type="number" min="30" max="180" step="15" value="${s.sportMin}"></div></div>
        <div class="row" style="margin-top:14px"><button class="btn pri" data-a="saveSettings">Enregistrer et replanifier</button></div></div>
      <div class="card"><div class="card-h"><h3>Cours fixes (non modifiables)</h3></div><div class="row" style="gap:8px">${s.courses.map(c => `<span class="chip b-ok" style="background:var(--course-soft);color:var(--course)">${E.DAYS[c.dow]} ${c.start}–${c.end}</span>`).join('')}</div><p class="hint" style="margin-top:8px">Développement Informatique – Option Full Stack. Ces horaires ne sont jamais déplacés par l'application.</p></div>
      <div class="card"><div class="card-h"><h3>Apparence</h3></div>${seg('theme', [['auto', 'Automatique'], ['light', 'Clair'], ['dark', 'Sombre']], s.theme)}</div>
      <div class="card"><div class="card-h"><h3>Données</h3></div><p class="hint" style="margin-bottom:10px">Tout est enregistré automatiquement dans ce navigateur. Exportez une copie avant de changer d'appareil.</p><div class="row"><button class="btn" data-a="export">Exporter</button><button class="btn" data-a="import">Importer</button><button class="btn" data-a="runTests">Tester les calculs</button><span class="sp"></span>
        ${U.resetStep ? `<span class="hint">Tout effacer définitivement ?</span><button class="btn dng" data-a="resetGo">Oui, effacer</button><button class="btn" data-a="resetNo">Annuler</button>` : `<button class="btn dng" data-a="resetAsk">Réinitialiser</button>`}</div></div>`;
  }

  /* ---------- Fenêtres ---------- */
  function modalDay(date) {
    const dn = E.toDn(date), info = E.dayInfo(dn, S), cs = E.coursesOn(dn, S), acts = S.activities.filter(a => a.date === date).sort(byTime);
    const raw = E.serviceStarting(dn, S), lv = info.leaves, sv = E.effService(dn, S), jkey = sv ? `${date}|${sv.type}` : null, j = jkey ? (S.journal[jkey] || {}) : {};
    let h = `<div class="modal-h"><h2>${E.dayLong(dn)}</h2><button class="ib" data-a="closeModal" aria-label="Fermer">${icon('x')}</button></div><div class="row">${kindChip(info)}<span class="hint">${E.parts(dn).y}</span></div>${timeline(dn)}`;
    h += `<div class="card" style="box-shadow:none;background:var(--surface2);padding:12px"><div class="hint" style="margin-bottom:8px">Service de ce jour</div><div class="row" style="gap:6px">
      ${raw && raw.type && !raw.extra ? `<button class="btn sm" data-a="leaveDay" data-d="${date}" data-k="conge">Congé</button><button class="btn sm" data-a="leaveDay" data-d="${date}" data-k="absence">Absence</button>` : `<button class="btn sm" data-a="leaveDay" data-d="${date}" data-k="renfort" data-sh="day">Renfort jour</button><button class="btn sm" data-a="leaveDay" data-d="${date}" data-k="renfort" data-sh="night">Renfort nuit</button>`}
      ${lv.length ? `<button class="btn sm dng" data-a="leaveClear" data-d="${date}">Retirer ${lv.map(l => ({ conge: 'le congé', absence: "l'absence", renfort: 'le renfort' }[l.kind])).join(', ')}</button>` : ''}</div></div>`;
    cs.forEach(c => { const x = E.sessionsInRange(dn, dn, S).find(s => s.start === c.start); if (x) h += `<div><div class="hint" style="margin-bottom:6px">Cours Full Stack</div>${sessionCard(x)}</div>`; });
    h += `<div><div class="row" style="margin-bottom:8px"><h3>Activités</h3><span class="sp"></span><button class="btn sm" data-a="actNew" data-d="${date}">${icon('plus')}Ajouter</button></div><div class="stack" style="gap:6px">${acts.length ? acts.map(a => actRow(a)).join('') : '<p class="mut sm">Aucune activité.</p>'}</div></div>`;
    if (jkey) h += `<div class="field"><label for="jn-m">Journal du service (${svcName(sv.type).toLowerCase()})</label><textarea id="jn-m" data-c="jnote" data-key="${jkey}" placeholder="Notes sur ce service…">${esc(j.note || '')}</textarea></div>`;
    return h;
  }
  function modalAct(m) {
    const a = m.act, isNew = !m.id;
    return `<div class="modal-h"><h2>${isNew ? 'Nouvelle activité' : "Modifier l'activité"}</h2><button class="ib" data-a="closeModal" aria-label="Fermer">${icon('x')}</button></div>
      <div class="fgrid"><div class="field" style="grid-column:1/-1"><label for="af-title">Titre</label><input id="af-title" class="actf" value="${esc(a.title)}"></div>
      <div class="field"><label for="af-type">Type</label><select id="af-type" class="actf">${Object.entries(T).map(([k, v]) => `<option value="${k}" ${a.type === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="af-status">Statut</label><select id="af-status" class="actf">${Object.entries(AST).map(([k, v]) => `<option value="${k}" ${a.status === k ? 'selected' : ''}>${v}</option>`).join('')}</select></div>
      <div class="field"><label for="af-date">Date</label><input id="af-date" type="date" class="actf" value="${a.date}"></div>
      <div class="field"><label for="af-start">Début</label><input id="af-start" type="time" step="900" class="actf" value="${a.start}"></div>
      <div class="field"><label for="af-end">Fin</label><input id="af-end" type="time" step="900" class="actf" value="${a.end}"></div></div>
      <div id="af-msg" class="errs" aria-live="polite"></div>
      <div class="row">${isNew ? '' : `<button class="btn dng" data-a="actDel" data-id="${m.id}">${icon('trash')}Supprimer</button>`}<span class="sp"></span><button class="btn" data-a="closeModal">Annuler</button><button class="btn pri" data-a="actSave">Enregistrer</button></div>`;
  }
  function readAct() {
    const g = id => ($('#' + id) || {}).value;
    return { title: (g('af-title') || '').trim(), type: g('af-type'), status: g('af-status'), date: g('af-date'), start: g('af-start'), end: g('af-end') };
  }
  function liveCheck() {
    const el = $('#af-msg'); if (!el || !U.modal || U.modal.t !== 'act') return;
    const a = readAct(); if (!a.date || !a.start || !a.end) { el.innerHTML = ''; return; }
    const v = E.validateActivity(a, S, U.modal.id);
    el.innerHTML = v.errors.map(e => `<div class="alert danger">${icon('alert')}<span>${esc(e)}</span></div>`).join('') + v.warnings.map(e => `<div class="alert warn">${icon('alert')}<span>${esc(e)}</span></div>`).join('') || '';
  }
  function modalSetup() {
    const s = S.settings;
    return `<div class="modal-h"><h2>Bienvenue dans Smart Life Planner</h2></div><p class="mut">Indiquez un jour de votre rotation. Tout le planning est calculé à partir de cette date de référence.</p>${refForm(s.refDate, s.refPhase)}
      <div class="row"><button class="btn" data-a="setupLater">Plus tard</button><span class="sp"></span><button class="btn pri" data-a="setupSave">Valider et planifier</button></div>`;
  }
  function modalJson(m) {
    return `<div class="modal-h"><h2>${m.mode === 'export' ? 'Exporter' : 'Importer'}</h2><button class="ib" data-a="closeModal" aria-label="Fermer">${icon('x')}</button></div>
      <p class="hint">${m.mode === 'export' ? 'Copiez ce texte et conservez-le dans un fichier. Il contient toutes vos données.' : 'Collez ici une sauvegarde exportée. Elle remplacera les données actuelles.'}</p>
      <div class="field"><label for="js-box">Sauvegarde (JSON)</label><textarea id="js-box" class="code" ${m.mode === 'export' ? 'readonly' : ''}>${m.mode === 'export' ? esc(JSON.stringify(S, null, 1)) : ''}</textarea></div>
      <div class="row"><span class="sp"></span>${m.mode === 'export' ? `<button class="btn pri" data-a="copyJson">${icon('copy')}Copier</button>` : `<button class="btn pri" data-a="importGo">Importer</button>`}</div>`;
  }
  function modalTests() {
    const r = E.selfTest(), ko = r.filter(x => !x.ok).length;
    return `<div class="modal-h"><h2>Tests des calculs</h2><button class="ib" data-a="closeModal" aria-label="Fermer">${icon('x')}</button></div><div class="row"><span class="chip ${ko ? 'b-conflict' : 'b-ok'}">${r.length - ko} / ${r.length} réussis</span></div>
      <div class="stack" style="gap:5px">${r.map(x => `<div class="res"><span class="${x.ok ? 'ok' : 'ko'}">${x.ok ? '✓' : '✗'}</span><span>${esc(x.name)}${x.ok ? '' : ' — ' + esc(x.info)}</span></div>`).join('')}</div>`;
  }
  function renderModal() {
    const el = $('#modal'), m = U.modal;
    if (!m) { el.innerHTML = ''; return; }
    const body = m.t === 'day' ? modalDay(m.date) : m.t === 'act' ? modalAct(m) : m.t === 'setup' ? modalSetup() : m.t === 'json' ? modalJson(m) : modalTests();
    el.innerHTML = `<div class="ov" data-a="ovClick"><div class="modal ${m.t === 'tests' || m.t === 'day' ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="Fenêtre">${body}</div></div>`;
    if (m.t === 'act') liveCheck();
  }

  /* ---------- Rendu principal ---------- */
  const VIEWS = {
    home: { t: 'Accueil', n: 'Accueil', s: 'Accueil', i: 'home', f: vHome }, pro: { t: 'Planning professionnel', n: 'Planning pro', s: 'Service', i: 'shield', f: vPro },
    acad: { t: 'Formation Full Stack', n: 'Formation', s: 'Cours', i: 'cap', f: vAcad }, perso: { t: 'Développement personnel', n: 'Développement', s: 'Progrès', i: 'trend', f: vPerso },
    agenda: { t: 'Agenda', n: 'Agenda', s: 'Agenda', i: 'calendar', f: vAgenda }, settings: { t: 'Réglages', n: 'Réglages', s: 'Réglages', i: 'gear', f: vSettings }
  };
  function render() {
    const y = window.scrollY, V = VIEWS[U.view], now = new Date(), t = E.todayDn(now);
    const alerts = E.computeAlerts(S, t, 7).filter(a => a.level === 'danger');
    const navs = Object.entries(VIEWS);
    let banner = '';
    if (!S.settings.configured) banner = `<div class="banner">${icon('alert')}Date de référence non configurée : le planning n'est pas fiable.<button class="btn sm" data-a="openSetup">Configurer</button></div>`;
    else if (alerts.length) banner = `<div class="banner danger">${icon('alert')}${alerts.length} conflit(s) dans les 7 prochains jours.<button class="btn sm" data-a="go" data-v="home">Voir</button></div>`;
    $('#app').innerHTML = `<div class="app"><aside class="side"><div class="brand"><div class="logo">${icon('calendar')}</div><div><b>Smart Life Planner</b><span>Douanes · Full Stack</span></div></div>
      ${navs.map(([k, v]) => `<button class="nav ${U.view === k ? 'on' : ''}" data-a="go" data-v="${k}">${icon(v.i)}${v.n}</button>`).join('')}
      <div class="side-foot">Cycle réglé sur le ${E.dayLong(E.toDn(S.settings.refDate))}, ${esc(E.PHASE_NAMES[S.settings.refPhase].toLowerCase())}.</div></aside>
      <div class="main"><header class="top"><h1>${V.t}</h1><button class="ib" data-a="themeToggle" aria-label="Changer de thème">${icon(isDark() ? 'sun' : 'moon')}</button><div class="date">${E.dayLong(t)} ${E.parts(t).y}</div></header>${banner}<main id="main">${V.f()}</main></div>
      <nav class="bottom" aria-label="Navigation">${navs.map(([k, v]) => `<button class="bnav ${U.view === k ? 'on' : ''}" data-a="go" data-v="${k}">${icon(v.i)}${v.s}</button>`).join('')}</nav></div>`;
    window.scrollTo(0, y);
  }
  function refresh() { render(); renderModal(); }

  /* ---------- Actions ---------- */
  const A = {
    go(d) { U.view = d.v; U.modal = null; refresh(); window.scrollTo(0, 0); },
    acadGo() { U.view = 'acad'; U.acadSub = 'makeups'; refresh(); },
    themeToggle() { S.settings.theme = isDark() ? 'light' : 'dark'; applyTheme(); save(); refresh(); },
    theme(d) { S.settings.theme = d.s; applyTheme(); save(); refresh(); },
    proSub(d) { U.proSub = d.s; refresh(); }, acadSub(d) { U.acadSub = d.s; refresh(); }, agSub(d) { U.agSub = d.s; refresh(); },
    mprev() { U.mM--; if (U.mM < 0) { U.mM = 11; U.mY--; } refresh(); }, mnext() { U.mM++; if (U.mM > 11) { U.mM = 0; U.mY++; } refresh(); },
    mtoday() { const n = new Date(); U.mY = n.getFullYear(); U.mM = n.getMonth(); refresh(); },
    yprev() { U.yY--; refresh(); }, ynext() { U.yY++; refresh(); },
    openMonth(d) { U.mY = U.yY; U.mM = Number(d.m); U.proSub = 'month'; refresh(); },
    wprev() { U.weekDn -= 7; refresh(); }, wnext() { U.weekDn += 7; refresh(); }, wtoday() { U.weekDn = E.weekStart(E.todayDn()); refresh(); },
    day(d) { U.modal = { t: 'day', date: d.d }; refresh(); },
    closeModal() { U.modal = null; refresh(); },
    ovClick(d, e) { if (e.target.classList.contains('ov')) A.closeModal(); },
    sess(d) {
      E.setSessionStatus(S, d.d, d.s); save();
      if (d.s === 'absent') toast('Absence enregistrée : tâche de rattrapage créée.', 'warn');
      refresh();
    },
    actToggle(d) {
      const a = S.activities.find(x => x.id === d.id); if (!a) return;
      E.setActivityStatus(S, a, a.status === 'done' ? 'planned' : 'done'); save();
      toast(a.status === 'done' ? 'Activité terminée.' : 'Activité remise à faire.'); refresh();
    },
    actNew(d) {
      const date = d.d || E.fromDn(E.todayDn()), type = d.t || 'fr', info = E.dayInfo(E.toDn(date), S);
      const dflt = { fr: '15:00', en: '11:00', ai: '10:00', sport: '17:30', other: '14:00', rattrapage: '10:00' }[type], s = E.tmin(dflt), len = type === 'sport' ? S.settings.sportMin : S.settings.actMin;
      U.modal = { t: 'act', id: null, act: { title: T[type], type, status: 'planned', date, start: E.mtime(s), end: E.mtime(s + len) } }; refresh();
    },
    actEdit(d) { const a = S.activities.find(x => x.id === d.id); if (!a) return; U.modal = { t: 'act', id: a.id, act: { ...a } }; refresh(); },
    actSave() {
      const f = readAct(), m = U.modal; if (!f.title) f.title = T[f.type];
      if (!f.date || !f.start || !f.end) { toast('Renseignez la date et les horaires.', 'err'); return; }
      const v = E.validateActivity(f, S, m.id);
      if (v.errors.length) { liveCheck(); toast('Cette activité ne peut pas être enregistrée : ' + v.errors[0], 'err'); return; }
      if (m.id) {
        const a = S.activities.find(x => x.id === m.id); Object.assign(a, f, { auto: false, locked: true });
        if (a.status !== m.act.status) E.setActivityStatus(S, a, a.status);
      } else S.activities.push({ id: E.uid(), ...f, auto: false, locked: false, makeupId: m.makeupId || null }), m.makeupId && linkMakeup(m.makeupId);
      save(); U.modal = m.back ? { t: 'day', date: f.date } : null; toast(v.warnings.length ? 'Enregistrée. À noter : ' + v.warnings[0] : 'Activité enregistrée.', v.warnings.length ? 'warn' : ''); refresh();
    },
    actDel(d) {
      const a = S.activities.find(x => x.id === d.id);
      if (a && a.makeupId) { const mk = S.makeups.find(m => m.id === a.makeupId); if (mk) { mk.activityId = null; mk.status = 'todo'; } }
      S.activities = S.activities.filter(x => x.id !== d.id); save(); U.modal = null; toast('Activité supprimée.'); refresh();
    },
    planWeek(d) {
      const t = E.todayDn(), w = Number(d.w), r = E.planWeek(S, w, t, true); save();
      planToast(r, 0); refresh();
    },
    planAhead(d) { const t = E.todayDn(), r = E.planWeeks(S, Number(d.w), 4, t, true); save(); planToast(r, 0); refresh(); },
    clearAuto(d) { const w = Number(d.w), n = S.activities.length; S.activities = S.activities.filter(a => { const x = E.toDn(a.date); return !(a.auto && a.status === 'planned' && !a.makeupId && x >= w && x <= w + 6); }); save(); toast(`${n - S.activities.length} activité(s) retirée(s).`); refresh(); },
    leaveAdd() {
      const kind = $('#lv-kind').value, from = $('#lv-from').value, to = $('#lv-to').value || from, shift = $('#lv-shift').value;
      if (!from) { toast('Choisissez une date.', 'err'); return; }
      let n = 0; for (let d = E.toDn(from); d <= E.toDn(to) && d < E.toDn(from) + 400; d++) {
        const raw = E.serviceStarting(d, { ...S, leaves: [] }), date = E.fromDn(d);
        if (S.leaves.some(l => l.date === date)) continue;
        if (kind === 'renfort' ? !raw : !!raw) { S.leaves.push({ id: E.uid(), date, kind, shift: kind === 'renfort' ? shift : null }); n++; }
      }
      if (!n) { toast(kind === 'renfort' ? 'Ces jours ont déjà un service.' : "Aucun service à annuler sur cette période.", 'warn'); return; }
      replan(true); toast(`${n} jour(s) ajouté(s).`); refresh();
    },
    leaveDay(d) {
      S.leaves = S.leaves.filter(l => l.date !== d.d); S.leaves.push({ id: E.uid(), date: d.d, kind: d.k, shift: d.sh || null });
      replan(true); toast('Planning mis à jour.'); refresh();
    },
    leaveClear(d) { S.leaves = S.leaves.filter(l => l.date !== d.d); replan(true); toast('Planning mis à jour.'); refresh(); },
    leaveDel(d) { S.leaves = S.leaves.filter(l => l.id !== d.id); replan(true); refresh(); },
    mkPropose(d) {
      const mk = S.makeups.find(m => m.id === d.id), t = E.todayDn(), c = E.proposeMakeupSlot(S, mk, t);
      if (!c) { toast('Aucun créneau libre de 2 h dans les 4 prochaines semaines.', 'warn'); return; }
      const a = { id: E.uid(), date: E.fromDn(c.dn), start: E.mtime(c.start), end: E.mtime(c.end), type: 'rattrapage', title: `Rattrapage du ${E.dayShort(E.toDn(mk.sessionDate))}`, status: 'planned', auto: false, locked: true, makeupId: mk.id };
      S.activities.push(a); mk.activityId = a.id; mk.status = 'planned'; save(); toast(`Rattrapage planifié : ${E.dayLong(c.dn)} à ${a.start}.`); refresh();
    },
    mkManual(d) {
      const mk = S.makeups.find(m => m.id === d.id), t = E.todayDn();
      U.modal = { t: 'act', id: null, makeupId: mk.id, act: { title: `Rattrapage du ${E.dayShort(E.toDn(mk.sessionDate))}`, type: 'rattrapage', status: 'planned', date: E.fromDn(t + 1), start: '10:00', end: '12:00' } }; refresh();
    },
    mkDone(d) { const mk = S.makeups.find(m => m.id === d.id); mk.status = 'done'; S.sessions[mk.sessionDate] = { status: 'makeup' }; save(); toast('Rattrapage effectué.'); refresh(); },
    modAdd() { const v = ($('#mod-new').value || '').trim(); if (!v) return; S.modules.push({ id: E.uid(), name: v, pct: 0 }); save(); refresh(); },
    modDel(d) { S.modules = S.modules.filter(m => m.id !== d.id); save(); refresh(); },
    fltReset() { U.flt = { from: '', to: '', type: 'all', status: 'all' }; refresh(); },
    saveSettings() {
      const s = S.settings, ref = $('#st-ref').value, ph = Number($('#st-phase').value);
      if (!ref) { toast('Choisissez une date de référence.', 'err'); return; }
      s.refDate = ref; s.refPhase = ph; s.configured = true; if (!s.since) s.since = E.fromDn(E.todayDn());
      ['fr', 'en', 'ai', 'sport'].forEach(k => { const v = parseFloat($('#g-' + k).value); if (!isNaN(v) && v >= 0) s.goals[k] = v; });
      const sm = parseInt($('#g-sportMin').value, 10); if (sm >= 30) s.sportMin = sm;
      replan(); refresh();
    },
    setupSave() {
      const ref = $('#st-ref').value; if (!ref) { toast('Choisissez une date de référence.', 'err'); return; }
      S.settings.refDate = ref; S.settings.refPhase = Number($('#st-phase').value); S.settings.configured = true; if (!S.settings.since) S.settings.since = E.fromDn(E.todayDn());
      U.modal = null; replan(); refresh();
    },
    setupLater() { U.modal = null; refresh(); },
    openSetup() { U.modal = { t: 'setup' }; refresh(); },
    export() { U.modal = { t: 'json', mode: 'export' }; refresh(); },
    import() { U.modal = { t: 'json', mode: 'import' }; refresh(); },
    copyJson() {
      const box = $('#js-box'); box.select();
      (navigator.clipboard ? navigator.clipboard.writeText(box.value) : Promise.reject()).then(() => toast('Copié.'), () => { try { document.execCommand('copy'); toast('Copié.'); } catch (e) { toast('Sélectionnez le texte et copiez-le manuellement.', 'warn'); } });
    },
    importGo() {
      try { const o = JSON.parse($('#js-box').value); if (!o || !o.settings || !Array.isArray(o.activities)) throw 0; S = migrate(o); save(); applyTheme(); U.modal = null; toast('Données importées.'); refresh(); }
      catch (e) { toast('Sauvegarde invalide : vérifiez le texte collé.', 'err'); }
    },
    runTests() { U.modal = { t: 'tests' }; refresh(); },
    resetAsk() { U.resetStep = 1; refresh(); }, resetNo() { U.resetStep = 0; refresh(); },
    resetGo() { S = defaultState(); save(); applyTheme(); U.resetStep = 0; U.modal = { t: 'setup' }; refresh(); }
  };
  function linkMakeup(id) {
    const mk = S.makeups.find(m => m.id === id), a = S.activities[S.activities.length - 1]; if (mk && a) { mk.activityId = a.id; mk.status = 'planned'; }
  }

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-a]'); if (!el) return;
    const fn = A[el.dataset.a]; if (fn) { if (el.tagName === 'A') e.preventDefault(); fn(el.dataset, e); }
  });
  document.addEventListener('change', e => {
    const el = e.target, c = el.dataset && el.dataset.c;
    if (c === 'sf') { U.sf[el.dataset.f] = el.value; refresh(); }
    else if (c === 'flt') { U.flt[el.dataset.f] = el.value; refresh(); }
    else if (c === 'jnote' || c === 'jextra') {
      const k = el.dataset.key, j = S.journal[k] || (S.journal[k] = {});
      if (c === 'jnote') j.note = el.value; else j.extra = el.value; save();
    }
    else if (c === 'modName') { const m = S.modules.find(x => x.id === el.dataset.id); if (m) { m.name = el.value; save(); } }
    else if (c === 'modPct') { const m = S.modules.find(x => x.id === el.dataset.id); if (m) { m.pct = Number(el.value); save(); refresh(); } }
  });
  document.addEventListener('input', e => {
    const el = e.target;
    if (el.classList && el.classList.contains('actf')) liveCheck();
    if (el.classList && el.classList.contains('livep')) { const r = $('#st-ref').value, p = Number($('#st-phase').value); if (r) $('#st-prev').innerHTML = preview(r, p); }
  });
  document.addEventListener('change', e => { if (e.target.classList && e.target.classList.contains('livep')) { const r = $('#st-ref').value, p = Number($('#st-phase').value); if (r) $('#st-prev').innerHTML = preview(r, p); } });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && U.modal && U.modal.t !== 'setup') A.closeModal(); });

  /* Compte à rebours en direct */
  setInterval(() => {
    document.querySelectorAll('[data-cd]').forEach(el => {
      const ms = Number(el.dataset.cd) - Date.now(); el.textContent = fmtCd(ms);
      if (ms < -1000 && !el.dataset.done) { el.dataset.done = '1'; render(); }
    });
  }, 1000);
  /* Minuit passé : on remet à jour la date du jour */
  let lastDay = E.todayDn(); setInterval(() => { const n = E.todayDn(); if (n !== lastDay) { lastDay = n; refresh(); } }, 30000);

  applyTheme();
  if (!S.settings.configured) U.modal = { t: 'setup' };
  refresh();
  window.__slp = { get S() { return S; }, U, refresh };
})();

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
